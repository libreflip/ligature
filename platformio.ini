[platformio]
default_envs = hall-validation

[hall_validation]
serial_baud = 460800

[env:hall-validation]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
build_src_filter =
    -<*>
    +<hall_validation/>
build_flags =
    -DHALL_SERIAL_BAUD=${hall_validation.serial_baud}UL
monitor_speed = ${hall_validation.serial_baud}

[env:simplefoc-hall-validation]
extends = env:hall-validation
build_flags =
    ${env:hall-validation.build_flags}
    -DHALL_USE_SIMPLEFOC=1
lib_deps =
    askuric/Simple FOC @ 2.4.0

[env:motor-smoke]
extends = env:hall-validation
build_src_filter =
    -<*>
    +<motor_smoke/>
build_flags =
    ${env:hall-validation.build_flags}
    -DMOTOR_SMOKE_SERIAL_BAUD=${hall_validation.serial_baud}UL
lib_deps =
    askuric/Simple FOC @ 2.4.0

[motor_tuning]
serial_baud = 500000

[env:motor-tuning]
extends = env:hall-validation
build_src_filter =
    -<*>
    +<motor_tuning/>
build_flags =
    -DMOTOR_TUNING_SERIAL_BAUD=${motor_tuning.serial_baud}UL
monitor_speed = ${motor_tuning.serial_baud}
lib_deps =
    askuric/Simple FOC @ 2.4.0
